# 全局配置
data_sources:
  primary: akshare           # 免费：akshare（新浪/东财/百度，财报+估值+日线+分红）
  fallback: [mock]           # 离线/测试兜底

storage:
  backend: sqlite           # sqlite 本地 / postgres(Supabase)
  path: data/market.db

llm:
  provider_env: LLM_PROVIDER
  model_env: LLM_MODEL
  temperature: 0.2
  scoring: true        # LLM 评分层：让大模型给各模块 0-100 评分（false 则用规则分）

monitor:
  schedule: "0 18 * * *"    # 每日 18:00 运行
  channels: [feishu, wechat]

session:
  store: memory              # memory 起步；生产换 duckdb/postgres
  default_model_version: "0.1.0"
