# Render 蓝图（docs/07-deployment-guide.md §1.2 / §2.6）
# ⚠️ 说明：
#   1. Blueprint 部署要求 workspace 先绑定支付方式（仅验证，免费额度内不扣费）。
#      不想绑卡 → 不提交此文件，直接在 Render 控制台手动创建 Free Web Service（免绑卡）。
#   2. Render 的 Cron Job 有最低 $1/月收费 → 已移除，每日采集/监控改用
#      GitHub Actions（.github/workflows/daily.yml，免费、无需绑卡）。
services:
  - type: web
    name: value-agent-api
    runtime: docker
    dockerfilePath: deploy/Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # 控制台填 Supabase Session Pooler 连接串
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: CORS_ORIGINS
        value: "*"
