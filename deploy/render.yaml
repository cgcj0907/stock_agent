# Render 蓝图（docs/07-deployment-guide.md §8）
services:
  - type: web
    name: value-agent-api
    runtime: docker
    dockerfilePath: deploy/Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # 控制台填 Supabase Session Pooler 连接串
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: CORS_ORIGINS
        value: "*"

  - type: cron
    name: value-agent-daily
    runtime: docker
    dockerfilePath: deploy/Dockerfile
    schedule: "0 18 * * *"
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
    startCommand: "sh -c 'python -m value_agent data update --daily || true; python -m value_agent monitor --daily || true'"
