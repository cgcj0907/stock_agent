[project]
name = "value-agent"
version = "0.1.0"
description = "A-share value investing analysis agent"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.14",            # A股数据（免费）
    "psycopg2-binary>=2.9",     # PostgreSQL（Supabase）
    "baostock>=0.8",            # A股历史数据（免费备用）
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "duckdb>=1.0",              # 单机存储起步；生产可换 PostgreSQL
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "litellm>=1.44",            # 统一 LLM 接入（DeepSeek/Qwen/GPT/本地）
    "chromadb>=0.5",            # RAG 向量库；生产可换 pgvector
    "apscheduler>=3.10",
    "pandera>=0.20",            # 数据 schema 校验
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/value_agent"]

[project.scripts]
value-agent = "value_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
